<!DOCTYPE html>
<html>
<head>
    <title>RAG App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Ubuntu', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 40px;
        }
        .wrapper { width: 100%; max-width: 760px; display: flex; flex-direction: column; }
        .title { font-size: 48px; font-weight: 300; margin-bottom: 40px; text-align: center; }
        .input-box {
            background-color: #202124; border: none; border-radius: 24px;
            padding: 24px; width: 100%; color: #fff; height: 100px;
            font-size: 16px; resize: none; display: block; margin: 0 auto 20px auto;
        }
        .input-box::placeholder { color: #9e9e9e; }
        .input-box:focus { outline: none; box-shadow: none; }
        .theme-switcher { position: fixed; top: 20px; right: 20px; cursor: pointer; }
        .theme-icon { color: #fff; font-size: 24px; }
        .response-card {
            background-color: #333333; border-radius: 16px; padding: 20px;
            margin-top: 20px; display: none; text-align: left; line-height: 1.7;
            height: 380px; overflow-y: scroll;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .response-card::-webkit-scrollbar { display: none; }
        #loader { display: none; text-align: center; margin-top: 20px; }
        .markdown-body { color: #fff; font-size: 15px; line-height: 1.8; }
        .markdown-body p { margin-bottom: 10px; }
        .markdown-body strong { color: #17d3d0; font-weight: 600; }
        .markdown-body ul, .markdown-body ol { padding-left: 24px; margin-bottom: 12px; }
        .markdown-body li { margin-bottom: 6px; }
        .markdown-body ol li { list-style-type: decimal; }
        .markdown-body ul li { list-style-type: disc; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: #17d3d0; margin-top: 16px; margin-bottom: 8px; font-weight: 500;
        }
        .markdown-body code {
            background-color: #1e1e1e; padding: 2px 6px;
            border-radius: 4px; font-size: 13px; color: #f8f8f2;
        }
        .markdown-body hr { border-color: #555; margin: 12px 0; }
        .MathJax { color: #fff !important; }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="wrapper">
        <div class="title">Attention Is All You Need</div>
        <textarea class="input-box" placeholder="Enter your query..." id="promptInput"></textarea>
        <div class="mb-3 text-end">
            <button class="btn btn-md btn-info me-1 ps-4 pe-4" onclick="askQuestion()"><b>Ask</b></button>
        </div>
        <div id="loader">
            <div class="spinner-border text-info" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <div class="response-card" id="responseCard"></div>
    </div>
    <div class="theme-switcher" onclick="toggleTheme()">
        <i class="fas fa-adjust theme-icon"></i>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        function toggleTheme() {
            var body = document.body;
            body.classList.toggle('light-theme');
            if (body.classList.contains('light-theme')) {
                body.style.backgroundColor = '#f0f0f0';
                body.style.color = '#121212';
            } else {
                body.style.backgroundColor = '#121212';
                body.style.color = '#fff';
            }
        }

        function renderMathAndMarkdown(text) {
            const mathBlocks = [];
            let result = text
                .replace(/\\\[[\s\S]*?\\\]/g, match => { mathBlocks.push(match); return `@@MATH${mathBlocks.length-1}@@`; })
                .replace(/\\\([\s\S]*?\\\)/g,  match => { mathBlocks.push(match); return `@@MATH${mathBlocks.length-1}@@`; })
                .replace(/\$\$[\s\S]*?\$\$/g,  match => { mathBlocks.push(match); return `@@MATH${mathBlocks.length-1}@@`; })
                .replace(/\$[^\$\n]+\$/g,       match => { mathBlocks.push(match); return `@@MATH${mathBlocks.length-1}@@`; });

            let html = marked.parse(result);
            html = html.replace(/@@MATH(\d+)@@/g, (_, i) => mathBlocks[parseInt(i)]);
            return html;
        }

        async function askQuestion() {
            var question = document.getElementById('promptInput').value.trim();
            var responseCard = document.getElementById('responseCard');
            var loader = document.getElementById('loader');

            if (!question) { alert("Please enter a question."); return; }

            loader.style.display = 'block';
            responseCard.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('question', question);
                let resp = await fetch('/get_answer', { method: 'POST', body: formData });
                let data = await resp.json();

                const renderedHTML = renderMathAndMarkdown(data.result);
                responseCard.innerHTML = `
                    <h6><b>Question:</b> ${question}</h6>
                    <hr style="border-color:#555">
                    <h6><b>Answer:</b></h6>
                    <div class="markdown-body">${renderedHTML}</div>
                `;

                if (window.MathJax) { await MathJax.typesetPromise([responseCard]); }

            } catch (error) {
                responseCard.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
            }

            loader.style.display = 'none';
            responseCard.style.display = 'block';
        }

        document.getElementById('promptInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askQuestion(); }
        });

        document.body.classList.add('dark-theme');
    </script>
</body>
</html>
